<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 5 · Consumo de API (Fetch)</title>
  <!--
    5. Consumo de API (10 puntos)
    Usa fetch() para consultar https://jsonplaceholder.typicode.com/users y mostrar los nombres
    en una lista HTML. Maneja errores de red y muestra un mensaje de carga mientras se obtiene
    la respuesta.
  -->
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f9fa;
      color: #212529;
      margin: 40px auto;
      max-width: 480px;
      padding: 0 16px;
    }

    .container {
      background: #ffffff;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0;
      font-size: 20px;
    }

    button.btn-fetch {
      background-color: #2b303a;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    button.btn-fetch:hover {
      background-color: #1a1d24;
    }

    button.btn-fetch:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-msg {
      font-size: 13px;
      color: #6c757d;
      margin-bottom: 12px;
      min-height: 18px;
    }

    .status-msg.error {
      color: #dc3545;
    }

    ul.lista-usuarios {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    ul.lista-usuarios li {
      padding: 8px 0;
      border-bottom: 1px solid #edf2f7;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    ul.lista-usuarios li:last-child {
      border-bottom: none;
    }

    .email {
      color: #6c757d;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Usuarios</h2>
      <button id="reloadBtn" class="btn-fetch">Recargar</button>
    </div>

    <div id="status" class="status-msg"></div>

    <ul id="userList" class="lista-usuarios"></ul>
  </div>

  <script>
    const API_URL = 'https://jsonplaceholder.typicode.com/users';
    const statusEl = document.getElementById('status');
    const userList = document.getElementById('userList');
    const reloadBtn = document.getElementById('reloadBtn');

    async function obtenerUsuarios() {
      statusEl.className = 'status-msg';
      statusEl.textContent = 'Cargando usuarios...';
      userList.innerHTML = '';
      reloadBtn.disabled = true;

      try {
        const respuesta = await fetch(API_URL);

        if (!respuesta.ok) {
          throw new Error(`Error ${respuesta.status}: ${respuesta.statusText}`);
        }

        const usuarios = await respuesta.json();
        statusEl.textContent = '';

        usuarios.forEach(usuario => {
          const li = document.createElement('li');

          const nombre = document.createElement('span');
          nombre.textContent = usuario.name;

          const email = document.createElement('span');
          email.textContent = usuario.email;
          email.className = 'email';

          li.appendChild(nombre);
          li.appendChild(email);
          userList.appendChild(li);
        });

      } catch (error) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'Ocurrió un error al cargar los usuarios.';
      } finally {
        reloadBtn.disabled = false;
      }
    }

    reloadBtn.addEventListener('click', obtenerUsuarios);

    obtenerUsuarios();
  </script>
</body>
</html>
